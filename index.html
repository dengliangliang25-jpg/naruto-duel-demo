<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>青岚 · 烬戟</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #07080c;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #07080c;
    touch-action: none;
  }
  #flowHint {
    position: fixed;
    left: 0; right: 0; bottom: 6vh;
    text-align: center;
    color: rgba(244,248,255,0.55);
    font: 14px "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    pointer-events: none;
    z-index: 2;
    display: none;
  }
</style>
</head>
<body>
<canvas id="arena" width="1280" height="720"></canvas>
<div id="flowHint">点击 / 按任意键继续</div>
<div id="boot" style="position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#07080c;color:#e8eef6;font:16px sans-serif">
  <div style="font-size:22px;font-weight:bold;margin-bottom:10px">青岚 · 烬戟</div>
  <div id="bootMsg">正在下载游戏脚本…</div>
  <div style="margin-top:8px;font-size:12px;opacity:.6" id="bootT">0s</div>
</div>
<script>
(function(){var t0=Date.now(),el=document.getElementById("bootT");var iv=setInterval(function(){if(!document.getElementById("boot")){clearInterval(iv);return;}el.textContent=Math.round((Date.now()-t0)/1000)+"s";},500);
window.addEventListener("error",function(e){var m=document.getElementById("bootMsg");if(m&&e&&e.target&&e.target.src)m.textContent="脚本加载失败，正在重试…";},true);})();
</script>
<script src="game.js?v=pages31i" onerror="(function(s){var n=document.createElement('script');n.src='game.js?v=pages31i&r='+Date.now();document.body.appendChild(n);})(this)"></script>

<script>
(function(){var last=0;
document.addEventListener("touchmove",function(e){e.preventDefault();},{passive:false});
document.addEventListener("touchend",function(e){var n=Date.now();if(n-last<350)e.preventDefault();last=n;},{passive:false});
["gesturestart","gesturechange","dblclick"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();},{passive:false});});
})();
</script>
</body>
</html>
