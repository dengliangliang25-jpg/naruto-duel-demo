<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>青岚 · 烬戟</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #07080c;
    overflow: hidden;
    font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #07080c;
    touch-action: none;
  }
  #flowHint {
    position: fixed;
    left: 0; right: 0; bottom: 6vh;
    text-align: center;
    color: rgba(244,248,255,0.55);
    font: 14px "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    pointer-events: none;
    z-index: 2;
    display: none;
  }
</style>
</head>
<body>
<canvas id="arena" width="1280" height="720"></canvas>
<div id="flowHint">点击 / 按任意键继续</div>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("arena");
  var ctx = canvas.getContext("2d");
  var W = 1280;
  var H = 720;
  var MIN_Y = 418;
  var MAX_Y = 662;
  var FAR_L = 430;
  var FAR_R = 850;
  var NEAR_L = 160;
  var NEAR_R = 1120;

  var keysDown = Object.create(null);
  var time = 0;
  var shake = 0;
  var koId = null;
  // Flow states: intro | mode | charSelect | countdown | fight | roundEnd | result
  var matchState = "intro";
  var countLeft = 3;
  var matchTime = 60;
  var matchResult = null;
  var gameMode = "ai"; // ai | vs
  var playerSide = "L"; // which side the human controls in AI mode
  var selectedChar = "obito"; // roster id chosen in char select
  var charHover = -1;
  var roundIndex = 1;
  var roundWinsL = 0;
  var roundWinsR = 0;
  var roundEndLeft = 0;
  var matchWinner = null;
  var paused = false;
  var simSpeed = 1;
  var phaseSlow = 0;
  var hudHidden = false;
  var hudHits = [];
  var uiLatch = 0;
  var flowHint = document.getElementById("flowHint");
  var charRoster = [
    { id: "obito", name: "带土", unlocked: true, blurb: "虚化 · 喷火 · 空间" },
    { id: "pain", name: "橙发", unlocked: true, blurb: "黑棒 · 气盾 · 吸引" },
    { id: "lockA", name: "影", unlocked: false, blurb: "即将开放" },
    { id: "lockB", name: "焰", unlocked: false, blurb: "即将开放" },
    { id: "lockC", name: "岚", unlocked: false, blurb: "即将开放" },
    { id: "lockD", name: "烬", unlocked: false, blurb: "即将开放" }
  ];
  var floaters = [];
  var projectiles = [];
  var spikes = [];
  var bursts = [];
  var ghosts = [];
  var rings = [];
  var sparks = [];
  var wheels = [];
  var swords = [];
  var voidSpace = false;
  var arenaImg = new Image();
  arenaImg.src = "arena-wide.png";
  var sharinganImg = new Image();
  sharinganImg.src = "sharingan.png";

  // Bump when sprite PNGs change so browsers/CDN do not serve stale frames.
  var ASSET_V = "pages9";
  function loadStrip(prefix, count, folder) {
    var arr = [];
    var i;
    if (!folder) folder = "obito";
    for (i = 1; i <= count; i++) {
      var img = new Image();
      var n = i < 10 ? "0" + i : String(i);
      img.src = folder + "/" + prefix + "_" + n + ".png?v=" + ASSET_V;
      arr.push(img);
    }
    return arr;
  }
  var obito = {
    idle: loadStrip("idle", 8),
    walk: loadStrip("walk", 8),
    run: loadStrip("run", 8),
    breath: loadStrip("breath", 8),
    firebreath: loadStrip("fire", 32, "obito/firebreath"),
    phase: loadStrip("phase", 8),
    tele: loadStrip("tele", 8),
    punch: loadStrip("punch", 8)
  };
  // Body-height match (obito 180px, pain 143px) then both shrunk by the same
  // 0.72, then another 0.88 (same for both) so they sit smaller on the expanded field.
  // Foot pads stay in source px and are multiplied by these scales, so the shared
  // ground line still lines up.
  var obitoScale = 1.48 * 0.72 * 0.88;
  var painScale = 180 * obitoScale / 143;
  // Body frames were rekeyed at 3x. Draw scale is divided so on-screen height
  // stays the same. painIdleFootPad is still the pre-upscale pad (6); the PNGs
  // have 18 transparent rows under the idle soles, and 18 * (painScale/3) = 6*painScale.
  var painFrameScale = 3;
  var obitoIdleFootPad = 2;
  var painIdleFootPad = 6;
  // Per-idle-frame transparent rows under soles (source px). Used to keep feet planted while idle cycles.
  var obitoIdleFootPads = [2, 2, 2, 2, 2, 2, 2, 2];
  var painIdleFootPads = [21, 21, 21, 24, 24, 19];
  // Drop pain so its feet share obito's ground line (pain has more empty rows under the sandals).
  var painFootDrop = painIdleFootPad * painScale - obitoIdleFootPad * obitoScale;
  // Lowest-opaque row gap under each tele frame (source px). Larger than idle means the art floats.
  var teleFootPad = [3, 4, 6, 11, 8, 9, 7, 4];
  var pain = {
    idle: loadStrip("idle", 6, "pain"),
    walk: loadStrip("walk", 6, "pain"),
    run: loadStrip("run", 6, "pain"),
    dash: loadStrip("dash", 6, "pain"),
    back: loadStrip("back", 6, "pain"),
    jump: loadStrip("jump", 6, "pain"),
    land: loadStrip("land", 6, "pain"),
    turn: loadStrip("turn", 6, "pain"),
    combo: loadStrip("combo", 6, "pain"),
    kick: loadStrip("kick", 6, "pain"),
    rod: loadStrip("rod", 6, "pain"),
    push: loadStrip("push", 6, "pain"),
    repulse: loadStrip("repulse", 20, "pain/repulse")
  };
  // Repulsion sheet: frames 1-12 are F05-F16, 13-20 are F17-F24. Play once, no loop.
  // 16 fps (was 12) shortens the wind-up; short press still ends on F16, long on F24.
  var repulseFps = 16;
  // Startup before the shield is live, scaled with the fps change (0.15 * 12 / 16).
  var repulseWind = 0.15 * 12 / repulseFps;
  // Standing head-to-sole on this sheet is 171px; idle opaque span is 149px.
  var repulseScale = painScale * (149 / 171);
  // Source px from the sandal sole up from the bottom of every repulse frame.
  var repulseFootPad = 53;
  function repulseSpan(long) {
    return (long ? 20 : 12) / repulseFps;
  }

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  function xLimits(y) {
    var span = MAX_Y - MIN_Y;
    var t = span === 0 ? 0 : (y - MIN_Y) / span;
    if (t < 0) t = 0;
    if (t > 1) t = 1;
    return {
      min: FAR_L + (NEAR_L - FAR_L) * t,
      max: FAR_R + (NEAR_R - FAR_R) * t
    };
  }

  function clampSpot(x, y) {
    if (voidSpace) {
      return { x: clamp(x, 150, 1130), y: clamp(y, 500, 650) };
    }
    return { x: clamp(x, 90, 1190), y: clamp(y, 430, 680) };
  }

  function boosted(f, amount) {
    if (voidSpace && f.id === "L") return Math.round(amount * 1.5);
    return amount;
  }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function makeFighter(id, name, x, palette) {
    return {
      id: id,
      name: name,
      x: x,
      y: 530,
      facing: id === "L" ? 1 : -1,
      hp: 120,
      maxHp: 120,
      chakra: 100,
      maxChakra: 100,
      palette: palette,
      weapon: id === "L" ? "blade" : "spear",
      anim: "idle",
      gait: "idle",
      animT: 0,
      animDur: 0.3,
      busy: 0,
      hitPending: false,
      dashT: 0,
      dashVx: 0,
      dashHit: false,
      flash: 0,
      invuln: 0,
      hurt: 0,
      stun: 0,
      airH: 0,
      airV: 0,
      launchVx: 0,
      launchVy: 0,
      airborne: false,
      phase: 0,
      armor: 0,
      aiIx: 0,
      aiIy: 0,
      aiThink: 0,
      skills: {}
    };
  }

  var left = makeFighter("L", "带土", 420, {
    body: "#24315c",
    trim: "#e8e4f2",
    glow: "#9eb6ff",
    deep: "#14182c",
    hot: "#f0d2c0"
  });
  var right = makeFighter("R", "橙发", 860, {
    body: "#2c2428",
    trim: "#ff7a3a",
    glow: "#ffb067",
    deep: "#1a1214",
    hot: "#ff8a3a"
  });

  left.skills = {
    punch: { key: "Q", name: "掌击", role: "突进", cd: 0, max: 0.7, cost: 0 },
    phase: { key: "E", name: "虚化", role: "灵体", cd: 0, max: 6, cost: 30 },
    tele: { key: "R", name: "传送", role: "突进", cd: 0, max: 1.15, cost: 16 },
    breath: { key: "F", name: "喷火", role: "远程", cd: 0, max: 1.7, cost: 22 },
    space: { key: "C", name: "切空间", role: "空间", cd: 0, max: 0, cost: 0 }
  };
  right.skills = {
    thrust: { key: "U", name: "连击", role: "平A", cd: 0, max: 0.78, cost: 0 },
    fire: { key: "I", name: "黑棒", role: "远程", cd: 0, max: 1.15, cost: 18 },
    swap: { key: "O", name: "后撤", role: "闪避", cd: 0, max: 1.2, cost: 10 },
    spike: { key: "P", name: "气盾", role: "绝技", cd: 0, max: 8, cost: 28 },
    pull: { key: "J", name: "吸引", role: "控制", cd: 0, max: 2.6, cost: 18 },
    cleave: { key: "K", name: "重脚", role: "平A", cd: 0, max: 0.9, cost: 8 }
  };

  var leftOrder = ["punch", "phase", "tele", "breath", "space"];
  var rightOrder = ["thrust", "fire", "swap", "spike", "pull", "cleave"];

  function other(f) { return f.id === "L" ? right : left; }

  function reset() {
    left.x = 420;
    right.x = 860;
    left.y = 530;
    right.y = 530;
    left.facing = 1;
    right.facing = -1;
    left.hp = left.maxHp;
    right.hp = right.maxHp;
    left.chakra = left.maxChakra;
    right.chakra = right.maxChakra;
    left.anim = "idle";
    right.anim = "idle";
    left.busy = right.busy = 0;
    left.dashT = right.dashT = 0;
    left.flash = right.flash = 0;
    left.invuln = right.invuln = 0;
    left.phase = right.phase = 0;
    left.hurt = right.hurt = 0;
    left.stun = right.stun = 0;
    left.airH = right.airH = 0;
    left.airV = right.airV = 0;
    left.launchVx = right.launchVx = 0;
    left.launchVy = right.launchVy = 0;
    left.airborne = right.airborne = false;
    left.hitPending = right.hitPending = false;
    left.aiIx = right.aiIx = 0;
    left.aiIy = right.aiIy = 0;
    left.aiThink = right.aiThink = 0;
    var k;
    for (k in left.skills) left.skills[k].cd = 0;
    for (k in right.skills) right.skills[k].cd = 0;
    projectiles.length = 0;
    spikes.length = 0;
    bursts.length = 0;
    right.shield = 0;
    right.shieldKey = false;
    right.shieldHit = false;
    ghosts.length = 0;
    rings.length = 0;
    sparks.length = 0;
    wheels.length = 0;
    swords.length = 0;
    floaters.length = 0;
    shake = 0;
    koId = null;
    voidSpace = false;
    right.armor = 0;
    phaseSlow = 0;
    left.rooted = right.rooted = 0;
    left.pullT = right.pullT = 0;
    left.pullFx = right.pullFx = 0;
    left.shieldWind = right.shieldWind = 0;
    right.repulseOn = false;
    right.repulseT = 0;
    right.repulseLong = false;
  }

  function spawnFloater(x, y, text, color) {
    floaters.push({ x: x, y: y, text: text, color: color, life: 0.75, max: 0.75 });
  }

  var LAUNCH_DMG = 12;
  var LAUNCH_G = 980;
  var IMPACT_K = 0.022;

  function isAirborne(f) {
    return !!(f && (f.airborne || (f.airH || 0) > 0.5));
  }

  function hurt(target, amount, color, opts) {
    opts = opts || {};
    if (koId || target.hp <= 0 || target.invuln > 0 || target.phase > 0 || target.shield > 0) return false;
    target.hp = Math.max(0, target.hp - amount);
    target.flash = 0.16;
    target.hurt = 0.14;
    var stunDur = 0.08 + amount * 0.035;
    if (stunDur > 0.85) stunDur = 0.85;
    target.stun = Math.max(target.stun || 0, stunDur);
    target.busy = 0;
    target.dashT = 0;
    target.anim = "idle";
    target.hitPending = false;
    target.hitPending2 = false;
    target.teleBlinked = false;
    shake = Math.min(14, shake + 4.5 + Math.min(4, amount * 0.12));
    spawnFloater(target.x + (Math.random() * 16 - 8), target.y - 148 - (target.airH || 0), String(amount), color);
    if (!opts.noLaunch) {
      spawnFloater(target.x + (Math.random() * 10 - 5), target.y - 178 - (target.airH || 0), "僵直", "#ffe7a0");
    }
    bursts.push({
      x: target.x + (Math.random() * 20 - 10),
      y: target.y - 78 - (target.airH || 0) + (Math.random() * 16 - 8),
      life: 0.28,
      max: 0.28,
      kind: "impact",
      facing: 1,
      scale: 1.15 + Math.min(0.9, amount * 0.04)
    });
    bursts.push({
      x: target.x,
      y: target.y - 86 - (target.airH || 0),
      life: 0.18,
      max: 0.18,
      kind: "flash",
      facing: target.facing || 1,
      scale: 1.2
    });
    var i;
    for (i = 0; i < 16; i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = 180 + Math.random() * 320;
      sparks.push({
        x: target.x + (Math.random() * 24 - 12),
        y: target.y - 80 - (target.airH || 0) + (Math.random() * 30 - 15),
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd * 0.75 - 60,
        life: 0.32 + Math.random() * 0.28,
        max: 0.55,
        color: i % 3 === 0 ? "#fff6d0" : color,
        size: 3 + Math.random() * 5
      });
    }
    if (!opts.noLaunch && amount >= LAUNCH_DMG) {
      var atk = other(target);
      var dx = target.x - atk.x;
      var dy = target.y - atk.y;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var nx = dx / len;
      var ny = dy / len;
      // Higher damage → faster and farther launch.
      var hSpd = 140 + amount * 22;
      target.launchVx = nx * hSpd;
      target.launchVy = ny * hSpd * 0.55;
      target.airV = 260 + amount * 20;
      target.airH = Math.max(target.airH || 0, 16);
      target.airborne = true;
      target.invuln = Math.max(target.invuln || 0, 8);
      spawnFloater(target.x, target.y - 200, "击飞", "#ffd0a0");
    }
    if (target.hp <= 0) {
      koId = target.id === "L" ? "R" : "L";
      finishRound(koId);
    }
    return true;
  }

  function landFighter(f) {
    var impactVy = Math.abs(f.airV || 0);
    f.airH = 0;
    f.airV = 0;
    f.launchVx = 0;
    f.launchVy = 0;
    f.airborne = false;
    f.invuln = 0;
    var impactDmg = Math.round(IMPACT_K * impactVy);
    if (impactDmg < 2) impactDmg = 2;
    if (impactDmg > 15) impactDmg = 15;
    shake = Math.min(16, shake + 3 + impactDmg * 0.2);
    bursts.push({
      x: f.x,
      y: f.y - 20,
      life: 0.36,
      max: 0.36,
      kind: "impact",
      facing: 1,
      scale: 1.6 + impactDmg * 0.06
    });
    bursts.push({
      x: f.x,
      y: f.y - 30,
      life: 0.22,
      max: 0.22,
      kind: "flash",
      facing: f.facing || 1,
      scale: 1.4
    });
    rings.push({ x: f.x, y: f.y, life: 0.35, max: 0.35, color: "#e8dcc0" });
    var si;
    for (si = 0; si < 12; si++) {
      var sang = Math.random() * Math.PI * 2;
      var sspd = 90 + Math.random() * 180;
      sparks.push({
        x: f.x + (Math.random() * 30 - 15),
        y: f.y - 8,
        vx: Math.cos(sang) * sspd,
        vy: Math.sin(sang) * sspd * 0.35 - 40,
        life: 0.28 + Math.random() * 0.2,
        max: 0.5,
        color: si % 2 === 0 ? "#d8c8a0" : "#fff4d0",
        size: 3 + Math.random() * 4
      });
    }
    hurt(f, impactDmg, "#ffe7a0", { noLaunch: true });
    spawnFloater(f.x, f.y - 160, "落地 " + impactDmg, "#ffc878");
    f.stun = Math.max(f.stun || 0, 0.38);
    f.invuln = 0.15;
  }

  function syncFlowHint() {
    if (!flowHint) return;
    if (matchState === "intro") {
      flowHint.style.display = "block";
      flowHint.textContent = "点击 / 按任意键继续";
    } else {
      flowHint.style.display = "none";
    }
  }

  function goIntro() {
    matchState = "intro";
    paused = false;
    syncFlowHint();
  }

  function goMode() {
    matchState = "mode";
    paused = false;
    syncFlowHint();
  }

  function goCharSelect() {
    matchState = "charSelect";
    paused = false;
    syncFlowHint();
  }

  function applyPlayerPick(charId) {
    selectedChar = charId;
    if (charId === "pain") playerSide = "R";
    else playerSide = "L";
  }

  function beginMatch() {
    roundIndex = 1;
    roundWinsL = 0;
    roundWinsR = 0;
    matchWinner = null;
    matchResult = null;
    if (gameMode === "vs") playerSide = "L"; // both human; sticks stay L/R
    beginCountdown();
  }

  function beginCountdown() {
    reset();
    matchState = "countdown";
    countLeft = 3;
    matchTime = 60;
    matchResult = null;
    koId = null;
    paused = false;
    roundEndLeft = 0;
    syncFlowHint();
  }

  function finishMatch(result) {
    if (matchState === "result") return;
    matchState = "result";
    matchResult = result;
    matchWinner = result;
    syncFlowHint();
  }

  function finishRound(result) {
    if (matchState !== "fight") return;
    matchResult = result;
    if (result === "L") roundWinsL += 1;
    else if (result === "R") roundWinsR += 1;
    if (roundWinsL >= 2 || roundWinsR >= 2 || roundIndex >= 3) {
      var final = "draw";
      if (roundWinsL > roundWinsR) final = "L";
      else if (roundWinsR > roundWinsL) final = "R";
      finishMatch(final);
      return;
    }
    matchState = "roundEnd";
    roundEndLeft = 2.2;
    syncFlowHint();
  }

  function isMenuState() {
    return matchState === "intro" || matchState === "mode" || matchState === "charSelect" || matchState === "result";
  }

  function humanControls(f) {
    if (gameMode === "vs") return true;
    return f.id === playerSide;
  }

  function aiFighter() {
    return playerSide === "L" ? right : left;
  }

  function humanFighter() {
    return playerSide === "L" ? left : right;
  }

  function endByTime() {
    if (left.hp > right.hp) finishRound("L");
    else if (right.hp > left.hp) finishRound("R");
    else finishRound("draw");
  }

  function tryCast(f, id) {
    if (paused || matchState !== "fight" || koId || (f.stun || 0) > 0 || isAirborne(f)) return;
    var sk = f.skills[id];
    if (!sk || sk.cd > 0) return;
    if ((id === "phase" || id === "needle") && f.phase > 0) return;
    if ((f.chakra || 0) < (sk.cost || 0)) return;
    // Using any other Obito skill during 虚化 drops out of it right away.
    if (f.id === "L" && f.phase > 0 && id !== "phase") endPhase(f);
    if (id === "space" || id === "dash") {
      castSpace(f);
      f.chakra -= sk.cost || 0;
      return;
    }
    if (id === "spike") {
      castShield(f, 1);
      return;
    }
    if (id === "phase" || id === "needle") {
      castNeedle(f);
      f.chakra -= sk.cost || 0;
      sk.cd = sk.max * ((voidSpace && f.id === "L") ? 0.65 : 1);
      return;
    }
    if (f.busy > 0 || f.dashT > 0) return;
    f.chakra -= sk.cost || 0;
    sk.cd = sk.max * ((voidSpace && f.id === "L") ? 0.65 : 1);
    if (id === "punch") beginMelee(f, "punch", 0.56, 0.24);
    else if (id === "slash") beginMelee(f, "slash", 0.28, 0.08);
    else if (id === "thrust") beginMelee(f, "combo", 0.72, 0.22, 0.48);
    else if (id === "cleave") beginMelee(f, "kick", 0.62, 0.34);
    else if (id === "breath") castBreath(f);
    else if (id === "fire") castRod(f);
    else if (id === "wave") castWave(f);
    else if (id === "tele" || id === "back") castBackstep(f);
    else if (id === "swap") castRetreat(f);
    else if (id === "pull") castPull(f);
  }

  function beginMelee(f, anim, dur, hitAt, hitAt2) {
    f.anim = anim;
    f.animT = 0;
    f.animDur = dur;
    f.hitAt = hitAt;
    f.hitPending = true;
    f.hitAt2 = hitAt2 || 0;
    f.hitPending2 = !!hitAt2;
    f.busy = dur;
  }

  function launchAt(f, kind, speed, r, dmg, life, originOff, chest) {
    var opp = other(f);
    var x0 = f.x + f.facing * originOff;
    var y0 = f.y - chest;
    var tx = opp.x;
    var ty = opp.y - chest;
    var dx = tx - x0;
    var dy = ty - y0;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    projectiles.push({
      kind: kind,
      x: x0,
      y: y0,
      vx: dx / len * speed,
      vy: dy / len * speed,
      r: r,
      dmg: dmg,
      owner: f.id,
      life: life
    });
  }

  function endPhase(f) {
    f.phase = 0;

  function painBodyH() {
    return 168 * painScale;
  }

  function shieldRadius() {
    return painBodyH() * 0.78;
  }

  function shieldWave(angle, spin) {
    return 1
      + 0.11 * Math.sin(angle * 3 + spin)
      + 0.07 * Math.sin(angle * 5 - spin * 1.35)
      + 0.045 * Math.sin(angle * 8 + spin * 0.65);
  }

  function shieldCenter(f) {
    var r = shieldRadius();
    return { x: f.x, y: f.y - r };
  }

  function palmOf(f) {
    return { x: f.x + f.facing * 58 * painScale, y: f.y - 108 * painScale };
  }

  function shieldAxes() {
    var rad = shieldRadius();
    return { rx: rad * 0.62, ry: rad * 0.92 };
  }

  function castShield(f, dur) {
    if (paused || matchState !== "fight" || koId || (f.stun || 0) > 0 || isAirborne(f)) return false;
    var sk = f.skills.spike;
    if (!sk || sk.cd > 0 || f.shield > 0 || f.shieldWind > 0) return false;
    if (f.busy > 0 || f.dashT > 0) return false;
    if ((f.chakra || 0) < (sk.cost || 0)) return false;
    f.chakra -= sk.cost || 0;
    f.shield = 0;
    f.shieldWind = repulseWind;
    f.repulseOn = true;
    f.repulseT = 0;
    f.repulseLong = true;
    f.shieldPlan = repulseSpan(true) - repulseWind;
    f.shieldDur = f.shieldPlan;
    f.shieldHit = false;
    f.anim = "idle";
    f.animT = 0;
    f.animDur = 0.2;
    f.busy = repulseWind;
    f.hitPending = false;
    return true;
  }

  function shieldPressDown(f) {
    f.shieldKeyAt = performance.now();
    if (castShield(f, 3)) f.shieldKey = true;
  }

  function shieldPressUp(f) {
    if (!f.shieldKey) return;
    f.shieldKey = false;
    var held = (performance.now() - (f.shieldKeyAt || performance.now())) / 1000;
    var long = held >= 0.35;
    f.repulseLong = long;
    var remain = repulseSpan(long) - (f.repulseT || 0);
    if (remain < 0.05) remain = 0.05;
    if (f.shieldWind > 0) {
      f.shieldPlan = Math.max(0.05, remain - f.shieldWind);
      f.shieldDur = f.shieldPlan;
      return;
    }
    if (!(f.shield > 0)) return;
    f.shield = remain;
    f.shieldDur = repulseSpan(long) - repulseWind;
  }

  function castPull(f) {
    f.anim = "push";
    f.animT = 0;
    f.animDur = 0.48;
    f.busy = 0.36;
    f.hitPending = false;
    f.pullFx = 0.6;
    var opp = other(f);
    var palm = palmOf(f);
    if (opp.phase > 0 || opp.invuln > 0 || opp.shield > 0) return;
    var pdx = Math.abs(opp.x - palm.x);
    var pdy = Math.abs((opp.y - 70) - palm.y);
    if (pdx > 600 || pdy > 240) return;
    opp.pullT = 0.34;
    opp.pullToX = palm.x - f.facing * 30;
    opp.pullToY = f.y;
    opp.pullHit = false;
    opp.rooted = 0;
  }

  function castRetreat(f) {

    for (gi = 0; gi < 3; gi++) {

      });

    f.invuln = 0.28;

  function castArmor(f) {

  function castSwap(f) {
    var opp = other(f);
    var dx = opp.x - f.x;
    var dy = opp.y - f.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = opp.x + dx / len * 118;
    var ny = opp.y + dy / len * 118;
    var spot = clampSpot(nx, ny);
    nx = spot.x;
    ny = spot.y;
    if (Math.sqrt((nx - opp.x) * (nx - opp.x) + (ny - opp.y) * (ny - opp.y)) < 72) {
      var edge = xLimits(clamp(opp.y, MIN_Y, MAX_Y));
      nx = f.x <= opp.x ? edge.max : edge.min;
      ny = clamp(opp.y, MIN_Y, MAX_Y);
      spot = clampSpot(nx, ny);
      nx = spot.x;
      ny = spot.y;
    }
    rings.push({ x: f.x, y: f.y, life: 0.35, max: 0.35, color: f.palette.glow });
    f.x = nx;
    f.y = ny;
    rings.push({ x: f.x, y: f.y, life: 0.4, max: 0.4, color: f.palette.trim });
    f.invuln = 0.14;
    f.anim = "swap";
    f.animT = 0;
    f.animDur = 0.22;
    f.busy = 0.18;
    f.hitPending = false;
  }

  function planarDist(ax, ay, bx, by) {
    var dx = ax - bx;
    var dy = ay - by;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function spawnComboFlash(f) {
    bursts.push({
      kind: "flash",
      x: f.x + f.facing * 78,

      life: 0.16,
      max: 0.16,

    });

  function spawnKickBurst(f) {
    bursts.push({
      kind: "impact",

      life: 0.26,
      max: 0.26,

    });

  function resolveMelee(f) {
    var opp = other(f);
    var dx = opp.x - f.x;
    var dy = opp.y - f.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var ahead = Math.atan2(dy, dx * f.facing);
    var inFront = Math.abs(ahead) < Math.PI * 0.72;
    if (f.anim === "slash" || f.anim === "punch") {
      if (inFront && dist < 124) hurt(opp, boosted(f, 8), f.palette.glow);
    } else if (f.anim === "thrust") {
      if (inFront && dist < 150) hurt(opp, 9, right.palette.glow);
    } else if (f.anim === "cleave") {
      if (inFront && dist < 128) hurt(opp, 14, right.palette.glow);
    } else if (f.anim === "combo") {
      if (inFront && dist < 132) hurt(opp, 8, right.palette.glow);
    } else if (f.anim === "kick") {
      if (inFront && dist < 156) hurt(opp, 16, right.palette.glow);
    }
  }

  function walkFighter(f, dt) {
    if (f.rooted > 0 || f.pullT > 0 || (f.stun || 0) > 0 || isAirborne(f)) {
      f.gait = "idle";
      return;
    }
    var ix = 0;
    var iy = 0;
    if (gameMode === "ai" && !humanControls(f)) {
      ix = f.aiIx || 0;
      iy = f.aiIy || 0;
    } else if (f.id === "L") {
      if (keysDown.a) ix -= 1;
      if (keysDown.d) ix += 1;
      if (keysDown.w) iy -= 1;
      if (keysDown.s) iy += 1;
      ix += sticks[0].nx;
      iy += sticks[0].ny;
      // In AI mode when human plays as R, left stick still drives the human (R).
    } else if (gameMode === "ai" && playerSide === "R") {
      if (keysDown.a) ix -= 1;
      if (keysDown.d) ix += 1;
      if (keysDown.w) iy -= 1;
      if (keysDown.s) iy += 1;
      ix += sticks[0].nx;
      iy += sticks[0].ny;
    } else {
      if (keysDown.ArrowLeft) ix -= 1;
      if (keysDown.ArrowRight) ix += 1;
      if (keysDown.ArrowUp) iy -= 1;
      if (keysDown.ArrowDown) iy += 1;
      ix += sticks[1].nx;
      iy += sticks[1].ny;
    }
    if (ix < 0) f.facing = -1;
    else if (ix > 0) f.facing = 1;
    if (ix === 0 && iy === 0) {
      f.gait = "idle";
      return;
    }
    f.gait = "run";
    var len = Math.sqrt(ix * ix + iy * iy);
    var speed = f.id === "L" ? 420 : 336;
    var step = clampSpot(f.x + ix / len * speed * dt, f.y + iy / len * speed * dt);
    f.x = step.x;
    f.y = step.y;
  }

  function updateAI(dt) {
    if (gameMode !== "ai" || matchState !== "fight" || koId) return;
    var f = aiFighter();
    var opp = humanFighter();
    if ((f.stun || 0) > 0 || f.rooted > 0 || f.pullT > 0 || isAirborne(f)) {
      f.aiIx = 0;
      f.aiIy = 0;
      return;
    }
    var dx = opp.x - f.x;
    var dy = opp.y - f.y;
    var dist = Math.sqrt(dx * dx + dy * dy) || 1;
    if (dx < 0) f.facing = -1;
    else if (dx > 0) f.facing = 1;
    f.aiThink = (f.aiThink || 0) - dt;
    var wantX = 0;
    var wantY = 0;
    var ideal = 118;
    if (dist > ideal + 28) {
      wantX = dx / dist;
      wantY = dy / dist * 0.55;
    } else if (dist < ideal - 36) {
      wantX = -dx / dist;
      wantY = -dy / dist * 0.35;
    } else {
      wantY = (dy > 18 ? 0.35 : (dy < -18 ? -0.35 : 0));
      if (Math.abs(dy) < 12 && Math.random() < 0.01) wantX = (Math.random() < 0.5 ? -0.2 : 0.2);
    }
    if (opp.phase > 0 && dist < 160) {
      wantX = -dx / dist;
      wantY = (Math.random() - 0.5) * 0.4;
    }
    f.aiIx = wantX;
    f.aiIy = wantY;
    if (f.busy > 0 || f.dashT > 0 || f.shield > 0 || f.shieldWind > 0) return;
    if (f.aiThink > 0) return;
    f.aiThink = 0.18 + Math.random() * 0.22;
    if (f.id === "R") {
      if (dist < 130 && f.skills.thrust.cd <= 0 && f.chakra >= (f.skills.thrust.cost || 0)) {
        tryCast(f, "thrust");
        return;
      }
      if (dist < 150 && f.skills.cleave.cd <= 0 && f.chakra >= (f.skills.cleave.cost || 0) && Math.random() < 0.55) {
        tryCast(f, "cleave");
        return;
      }
      if (dist > 160 && dist < 520 && f.skills.fire.cd <= 0 && f.chakra >= (f.skills.fire.cost || 0) && Math.random() < 0.45) {
        tryCast(f, "fire");
        return;
      }
      if (dist < 110 && f.skills.swap.cd <= 0 && f.chakra >= (f.skills.swap.cost || 0) && Math.random() < 0.35) {
        tryCast(f, "swap");
        return;
      }
      if (dist > 90 && dist < 420 && f.skills.pull.cd <= 0 && f.chakra >= (f.skills.pull.cost || 0) && Math.random() < 0.28) {
        tryCast(f, "pull");
        return;
      }
      if (dist < 150 && f.skills.spike.cd <= 0 && f.chakra >= (f.skills.spike.cost || 0) && Math.random() < 0.18) {
        tryCast(f, "spike");
        return;
      }
    } else {
      if (dist < 130 && f.skills.punch.cd <= 0) {
        tryCast(f, "punch");
        return;
      }
      if (dist > 140 && dist < 420 && f.skills.breath.cd <= 0 && f.chakra >= (f.skills.breath.cost || 0) && Math.random() < 0.4) {
        tryCast(f, "breath");
        return;
      }
      if (dist > 100 && dist < 360 && f.skills.tele.cd <= 0 && f.chakra >= (f.skills.tele.cost || 0) && Math.random() < 0.35) {
        tryCast(f, "tele");
        return;
      }
      if (dist < 160 && f.skills.phase.cd <= 0 && f.chakra >= (f.skills.phase.cost || 0) && f.phase <= 0 && Math.random() < 0.22) {
        tryCast(f, "phase");
        return;
      }
      if (f.skills.space && f.skills.space.cd <= 0 && Math.random() < 0.08) {
        tryCast(f, "space");
        return;
      }
    }
  }

  function update(dt) {
    time += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 18);

    var roster = [left, right];
    var i;
    for (i = 0; i < roster.length; i++) {
      var f = roster[i];
      var sk;
      for (sk in f.skills) {
        if (f.skills[sk].cd > 0) f.skills[sk].cd = Math.max(0, f.skills[sk].cd - dt);
      }
      if (f.chakra < f.maxChakra) f.chakra = Math.min(f.maxChakra, f.chakra + 16 * dt);
      if (f.flash > 0) f.flash = Math.max(0, f.flash - dt);
      if (f.invuln > 0) f.invuln = Math.max(0, f.invuln - dt);
      if (f.phase > 0) {
        f.phaseEye = (f.phaseEye || 0) + dt;
        f.phase = Math.max(0, f.phase - dt);
        if (f.phase <= 0) f.phaseEye = 0;
      }
      if (f.armor > 0) {
        f.armor -= dt;
        if (f.armor <= 0) {
          f.armor = 0;
          if (f.skills.spike) f.skills.spike.cd = f.skills.spike.max;
        }
      }
      if (f.pullFx > 0) f.pullFx = Math.max(0, f.pullFx - dt);
      if (f.rooted > 0) {
        f.rooted = Math.max(0, f.rooted - dt);
        f.dashT = 0;
      }
      if (f.pullT > 0) {
        var pullPrev = f.pullT;
        f.pullT -= dt;
        f.dashT = 0;
        var pu = pullPrev > 0.0001 ? Math.min(1, dt / pullPrev) : 1;
        var pulled = clampSpot(f.x + (f.pullToX - f.x) * pu, f.y + (f.pullToY - f.y) * pu);
        f.x = pulled.x;
        f.y = pulled.y;
        if (f.pullT <= 0) {
          f.pullT = 0;
          var landed = clampSpot(f.pullToX, f.pullToY);
          f.x = landed.x;
          f.y = landed.y;
          f.rooted = 1;
          if (!f.pullHit) {
            f.pullHit = true;
            hurt(f, 14, "#cfe6ff");
          }
        }
      }
      if (f.repulseOn) f.repulseT = (f.repulseT || 0) + dt;
      if (f.shieldWind > 0) {
        f.shieldWind -= dt;
        if (f.shieldWind <= 0) {
          f.shieldWind = 0;
          f.shield = f.shieldPlan || 1;
          f.shieldDur = f.shield;
          f.shieldHit = false;
        }
      }
      if (f.shield > 0) {
        f.shield -= dt;
        var oppS = other(f);
        var sc = shieldCenter(f);
        var rad = shieldRadius();
        var sdx = oppS.x - sc.x;
        var sdy = (oppS.y - 80) - sc.y;
        var sd = Math.sqrt(sdx * sdx + sdy * sdy);
        if (sd < rad) {
          var snx = sd > 0.01 ? sdx / sd : (f.facing || 1);
          var sny = sd > 0.01 ? sdy / sd : 0;
          var ox = sc.x + snx * (rad + 10);
          var oy = sc.y + sny * (rad + 10) + 80;
          var shoved = clampSpot(ox, oy);
          oppS.x = shoved.x;
          oppS.y = shoved.y;
          if (!f.shieldHit) {
            f.shieldHit = true;
            hurt(oppS, 16, "#d7ecff");
          }
        } else {
          f.shieldHit = false;
        }
        if (f.shield <= 0) {
          f.shield = 0;
          f.shieldKey = false;
          f.repulseOn = false;
          if (f.skills.spike) f.skills.spike.cd = f.skills.spike.max;
        }
      }
      if (f.hurt > 0) f.hurt = Math.max(0, f.hurt - dt);
      if (f.stun > 0) f.stun = Math.max(0, f.stun - dt);
      if (f.busy > 0) f.busy = Math.max(0, f.busy - dt);

      if (isAirborne(f)) {
        f.dashT = 0;
        f.gait = "idle";
        f.airV = (f.airV || 0) - LAUNCH_G * dt;
        f.airH = (f.airH || 0) + f.airV * dt;
        var flySpot = clampSpot(f.x + (f.launchVx || 0) * dt, f.y + (f.launchVy || 0) * dt);
        f.x = flySpot.x;
        f.y = flySpot.y;
        // Soft drag so arc settles.
        f.launchVx = (f.launchVx || 0) * Math.max(0, 1 - 0.35 * dt);
        f.launchVy = (f.launchVy || 0) * Math.max(0, 1 - 0.35 * dt);
        if (f.airH <= 0) {
          landFighter(f);
        } else {
          // Stay invulnerable for the whole flight.
          f.invuln = Math.max(f.invuln || 0, 0.05);
        }
        continue;
      }

      if (f.dashT > 0) {
        f.dashT -= dt;
        var prevX = f.x;
        var prevY = f.y;
        var dashSpot = clampSpot(f.x + f.dashVx * dt, f.y + f.dashVy * dt);
        f.x = dashSpot.x;
        f.y = dashSpot.y;
        if (!f.dashHit && !koId) {
          var opp = other(f);
          var abx = f.x - prevX;
          var aby = f.y - prevY;
          var apx = opp.x - prevX;
          var apy = opp.y - prevY;
          var ab2 = abx * abx + aby * aby;
          var t = ab2 > 0.0001 ? (apx * abx + apy * aby) / ab2 : 0;
          if (t < 0) t = 0;
          if (t > 1) t = 1;
          var cx = prevX + abx * t;
          var cy = prevY + aby * t;
          if (planarDist(opp.x, opp.y, cx, cy) < 48) {
            if (hurt(opp, 16, f.palette.glow)) f.dashHit = true;
          }
        }
        if (f.dashT <= 0) {
          f.dashT = 0;
          f.anim = "idle";
        }
      } else {
        if (!koId && f.busy <= 0) walkFighter(f, dt);
        else if (!koId && f.anim === "punch" && f.animT < f.animDur * 0.45) {
          var lunge = clampSpot(f.x + f.facing * 560 * dt, f.y);
          f.x = lunge.x;
          f.y = lunge.y;
        }
        if (f.anim !== "idle") {
        f.animT += dt;

      var ny = vx / vlen;
      for (k = 0; k <= steps; k++) {
        var t = k / steps;
        var wave = Math.sin(t * 12 - time * 16 + i * 1.4) * 22 * (1 - t);
        var x = sx + vx * t + nx * wave;
        var y = sy + vy * t + ny * wave;
        if (k === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.globalAlpha = 0.82 * fade;
      ctx.strokeStyle = i % 2 === 0 ? "rgba(12, 8, 10, 0.96)" : "rgba(150, 16, 22, 0.95)";
      ctx.lineWidth = i % 2 === 0 ? 6 : 4.2;
      ctx.stroke();
      ctx.globalAlpha = 0.95 * fade;
      ctx.strokeStyle = i % 2 === 0 ? "rgba(70, 8, 12, 0.95)" : "rgba(255, 54, 42, 0.92)";
      ctx.lineWidth = 1.8;
      ctx.stroke();
    }
    ctx.globalAlpha = 0.45 * fade;
    ctx.fillStyle = "rgba(40, 6, 8, 0.9)";
    ctx.beginPath();
    ctx.arc(palm.x, palm.y, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.9 * fade;
    ctx.strokeStyle = "rgba(190, 24, 28, 0.95)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(palm.x, palm.y, 28, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 0.95 * fade;
    ctx.fillStyle = "rgba(20, 8, 10, 0.95)";
    ctx.beginPath();
    ctx.arc(palm.x, palm.y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawRings() {
    var i;
    for (i = 0; i < rings.length; i++) {
      var r = rings[i];
      var u = 1 - r.life / r.max;
      ctx.save();
      ctx.globalAlpha = r.life / r.max;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, 18 + u * 70, 8 + u * 16, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawSparks() {
    var i;
    for (i = 0; i < sparks.length; i++) {
      var s = sparks[i];
      var sz = s.size || 3;
      ctx.globalAlpha = Math.max(0, s.life / s.max);
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, sz * 0.55, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(s.x - sz * 0.2, s.y - sz, sz * 0.4, sz * 2);
    }
    ctx.globalAlpha = 1;
  }

  function drawHp(f) {
    var w = 92;
    var h = 8;
    var x = f.x - w / 2;
    var depth = (f.y - MIN_Y) / (MAX_Y - MIN_Y);
    var y = f.y - 150 * (0.78 + depth * 0.3);
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    roundRect(x - 1, y - 1, w + 2, h + 2, 3);
    ctx.fill();
    var ratio = f.hp / f.maxHp;
    ctx.fillStyle = ratio > 0.35 ? f.palette.trim : "#ff4d6a";
    roundRect(x, y, Math.max(0, w * ratio), h, 3);
    ctx.fill();
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = f.palette.glow;
    ctx.fillText(f.name, f.x, y - 6);
    ctx.textAlign = "left";
  }

  function drawFloaters() {
    ctx.textAlign = "center";
    ctx.font = "bold 20px sans-serif";
    var i;
    for (i = 0; i < floaters.length; i++) {
      var t = floaters[i];
      ctx.globalAlpha = Math.max(0, t.life / t.max);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }

  function icon(id, cx, cy, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    if (id === "punch" || id === "slash") {
      ctx.beginPath();
      ctx.arc(0, 4, 14, Math.PI * 0.9, Math.PI * 2.15);
      ctx.stroke();
    } else if (id === "phase" || id === "needle") {
      ctx.beginPath();
      ctx.arc(0, 0, 11, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, 3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-11, 0);
      ctx.lineTo(11, 0);
      ctx.moveTo(0, -11);
      ctx.lineTo(0, 11);
      ctx.stroke();
    } else if (id === "tele" || id === "back") {
      ctx.beginPath();
      ctx.moveTo(-10, -7);
      ctx.lineTo(8, 0);
      ctx.lineTo(-10, 7);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(4, 0);
      ctx.lineTo(14, 0);
      ctx.stroke();
    } else if (id === "space" || id === "dash") {
      ctx.strokeRect(-12, -8, 10, 16);
      ctx.strokeRect(2, -8, 10, 16);
    } else if (id === "thrust") {
      ctx.beginPath();
      ctx.moveTo(-14, 0);
      ctx.lineTo(8, 0);
      ctx.moveTo(14, 0);
      ctx.lineTo(4, -5);
      ctx.lineTo(4, 5);
      ctx.fill();
    } else if (id === "breath" || id === "fire") {
      ctx.beginPath();
      ctx.arc(0, 2, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.45;
      ctx.beginPath();
      ctx.arc(-6, 2, 6, 0, Math.PI * 2);
      ctx.fill();
    } else if (id === "swap") {
      ctx.beginPath();
      ctx.arc(-6, 0, 7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(2, -6);
      ctx.lineTo(12, 0);
      ctx.lineTo(2, 6);
      ctx.stroke();
    } else if (id === "pull") {
      ctx.beginPath();
      ctx.moveTo(-12, -6);
      ctx.lineTo(2, -6);
      ctx.moveTo(-12, 6);
      ctx.lineTo(2, 6);
      ctx.moveTo(6, 0);
      ctx.lineTo(-2, -5);
      ctx.moveTo(6, 0);
      ctx.lineTo(-2, 5);
      ctx.stroke();
    } else if (id === "spike") {
      ctx.beginPath();
      ctx.arc(0, 0, 11, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, 11, time * 6, time * 6 + 1.4);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, 6, -time * 8, -time * 8 + 2);
      ctx.stroke();
    } else if (id === "wave") {
      ctx.beginPath();
      ctx.arc(2, 0, 10, -1.2, 1.2);
      ctx.stroke();
    } else if (id === "cleave") {
      ctx.beginPath();
      ctx.moveTo(-12, 6);
      ctx.quadraticCurveTo(0, -12, 12, 4);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawButton(x, y, w, h, f, id) {
    var sk = f.skills[id];
    var ready = sk.cd <= 0 && !koId && matchState === "fight";
    var p = f.palette;
    ctx.save();
    roundRect(x, y, w, h, 10);
    ctx.fillStyle = ready ? "rgba(8,10,16,0.82)" : "rgba(8,10,16,0.72)";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = ready ? p.trim : "rgba(140,140,150,0.35)";
    ctx.stroke();

    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "left";
    ctx.fillStyle = ready ? p.glow : "rgba(180,180,190,0.45)";
    roundRect(x + 8, y + 8, 22, 18, 4);
    ctx.fillStyle = ready ? p.deep : "#1a1c22";
    ctx.fill();
    ctx.strokeStyle = ready ? p.trim : "rgba(140,140,150,0.3)";
    ctx.stroke();
    ctx.fillStyle = ready ? p.glow : "rgba(170,170,180,0.4)";
    ctx.fillText(sk.key, x + 13, y + 21);

    icon(id, x + w * 0.62, y + 30, ready ? p.glow : "rgba(160,160,170,0.35)");

    ctx.font = "bold 15px sans-serif";
    ctx.fillStyle = ready ? "#f2f6f8" : "rgba(200,200,208,0.4)";
    ctx.fillText(sk.name, x + 10, y + h - 22);
    ctx.font = "11px sans-serif";
    ctx.fillStyle = ready ? p.trim : "rgba(160,160,170,0.35)";
    ctx.fillText(sk.role, x + 10, y + h - 8);

    if (sk.cd > 0) {
      var ratio = sk.cd / sk.max;
      ctx.beginPath();
      roundRect(x, y, w, h, 10);
      ctx.clip();
      ctx.beginPath();
      ctx.moveTo(x + w / 2, y + h / 2);
      ctx.arc(x + w / 2, y + h / 2, 90, -Math.PI / 2, -Math.PI / 2 + ratio * Math.PI * 2);
      ctx.closePath();
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fill();
      ctx.font = "bold 14px sans-serif";
      ctx.textAlign = "right";
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.fillText(sk.cd.toFixed(1), x + w - 8, y + 22);
    }
    ctx.restore();
  }

  function addHit(x, y, w, h, fn) {
    hudHits.push({ x: x, y: y, w: w, h: h, fn: fn });
  }

  function drawPortrait(cx, cy, f) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, 32, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(8,10,16,0.92)";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = f.palette.glow;
    ctx.shadowColor = f.palette.glow;
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(cx, cy, 26, 0, Math.PI * 2);
    var g = ctx.createRadialGradient(cx - 6, cy - 8, 4, cx, cy, 26);
    g.addColorStop(0, f.palette.hot);
    g.addColorStop(0.55, f.palette.body);
    g.addColorStop(1, f.palette.deep);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.fillStyle = "#1a1210";
    ctx.beginPath();
    ctx.arc(cx - 7, cy - 2, 3.1, 0, Math.PI * 2);
    ctx.arc(cx + 7, cy - 2, 3.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = f.palette.glow;
    ctx.beginPath();
    ctx.arc(cx - 7, cy - 2, 1.4, 0, Math.PI * 2);
    ctx.arc(cx + 7, cy - 2, 1.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = f.palette.trim;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy + 4, 9, 0.15, Math.PI - 0.15);
    ctx.stroke();
    ctx.restore();
  }

  function drawResourceBars(x, y, w, f, fromRight) {
    var hx = fromRight ? x - w : x;
    var hh = 16;
    ctx.save();
    ctx.fillStyle = "rgba(10,6,8,0.82)";
    roundRect(hx - 2, y - 2, w + 4, hh + 4, 5);
    ctx.fill();
    ctx.fillStyle = "rgba(48, 10, 10, 0.95)";
    roundRect(hx, y, w, hh, 4);
    ctx.fill();
    var ratio = f.maxHp > 0 ? f.hp / f.maxHp : 0;
    var hw = Math.max(0, w * ratio);
    if (hw > 0) {
      var hg = ctx.createLinearGradient(0, y, 0, y + hh);
      hg.addColorStop(0, "#ff6b5a");
      hg.addColorStop(0.45, "#e0232a");
      hg.addColorStop(1, "#8a1018");
      ctx.fillStyle = hg;
      if (fromRight) roundRect(hx + w - hw, y, hw, hh, 4);
      else roundRect(hx, y, hw, hh, 4);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.22)";
      if (fromRight) ctx.fillRect(hx + w - hw, y + 2, hw, 3);
      else ctx.fillRect(hx, y + 2, hw, 3);
    }
    ctx.strokeStyle = "rgba(255,220,180,0.35)";
    ctx.lineWidth = 1.5;
    roundRect(hx, y, w, hh, 4);
    ctx.stroke();
    var bw = Math.round(w * 0.82);
    var bx = fromRight ? x - bw : x;
    var by = y + 20;
    ctx.fillStyle = "rgba(6, 14, 28, 0.92)";
    roundRect(bx, by, bw, 8, 3);
    ctx.fill();
    var cRatio = f.maxChakra > 0 ? f.chakra / f.maxChakra : 0;
    var cw = Math.max(0, bw * cRatio);
    if (cw > 0) {
      var cg = ctx.createLinearGradient(0, by, 0, by + 8);
      cg.addColorStop(0, "#7ad0ff");
      cg.addColorStop(0.5, "#2f8fff");
      cg.addColorStop(1, "#1450c8");
      ctx.fillStyle = cg;
      if (fromRight) roundRect(bx + bw - cw, by, cw, 8, 3);
      else roundRect(bx, by, cw, 8, 3);
      ctx.fill();
    }
    ctx.strokeStyle = "rgba(140,190,255,0.35)";
    ctx.lineWidth = 1;
    roundRect(bx, by, bw, 8, 3);
    ctx.stroke();
    ctx.restore();
  }

  function drawSkillOrb(cx, cy, f, id) {
    var sk = f.skills[id];
    var r = 26;
    var ready = !paused && matchState === "fight" && sk.cd <= 0 && !(id === "spike" && (f.shield > 0 || f.shieldWind > 0)) && (f.chakra || 0) >= (sk.cost || 0);
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r + 3, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(6,8,12,0.55)";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    var bg = ctx.createRadialGradient(cx - 4, cy - 6, 2, cx, cy, r);
    bg.addColorStop(0, ready ? "#3a2218" : "#1a1412");
    bg.addColorStop(1, "#0c0a0c");
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = ready ? f.palette.glow : "rgba(120,100,90,0.55)";
    if (ready) {
      ctx.shadowColor = f.palette.glow;
      ctx.shadowBlur = 10;
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    icon(id, cx, cy - 2, ready ? "#fff8ef" : "#7a7470");
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = ready ? "#ffe7b0" : "rgba(200,180,150,0.45)";
    ctx.fillText(sk.key, cx, cy + 20);
    if (sk.max > 0 && sk.cd > 0) {
      var ratio = sk.cd / sk.max;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + ratio * Math.PI * 2);
      ctx.closePath();
      ctx.fillStyle = "rgba(0,0,0,0.62)";
      ctx.fill();
      ctx.font = "bold 13px sans-serif";
      ctx.fillStyle = "#fff";
      ctx.fillText(sk.cd.toFixed(1), cx, cy + 4);
    }
    ctx.restore();
    addHit(cx - r, cy - r, r * 2, r * 2, function () {
      if (!humanControls(f)) return;
      if (id === "spike") shieldPressDown(f);
      else tryCast(f, id);
    });
  }

  function drawPauseButton(cx, cy) {

  function drawCharSelectScreen() {
    panelBox(70, 70, W - 140, H - 140);
    ctx.textAlign = "center";
    ctx.font = "bold 34px sans-serif";
    ctx.fillStyle = "#f4fbff";
    ctx.fillText("选择你的角色", W / 2, 120);
    ctx.font = "15px sans-serif";
    ctx.fillStyle = "rgba(200,220,230,0.8)";
    ctx.fillText("已解锁 2 人，其余即将开放。对手自动是另一位解锁角色。", W / 2, 150);

    var cols = 3;
    var cardW = 250;
    var cardH = 168;
    var gapX = 28;
    var gapY = 22;
    var gridW = cols * cardW + (cols - 1) * gapX;
    var startX = (W - gridW) / 2;
    var startY = 180;
    var i;
    for (i = 0; i < charRoster.length; i++) {
      var c = charRoster[i];
      var col = i % cols;
      var row = Math.floor(i / cols);
      var x = startX + col * (cardW + gapX);
      var y = startY + row * (cardH + gapY);
      var unlocked = c.unlocked;
      var selected = unlocked && selectedChar === c.id;
      ctx.save();
      roundRect(x, y, cardW, cardH, 14);
      if (!unlocked) ctx.fillStyle = "rgba(28,30,36,0.92)";
      else if (selected) ctx.fillStyle = "rgba(20,48,52,0.95)";
      else ctx.fillStyle = "rgba(14,18,26,0.95)";
      ctx.fill();
      ctx.lineWidth = selected ? 3 : 2;
      ctx.strokeStyle = !unlocked ? "rgba(90,90,100,0.45)" : (selected ? "#3ef0e0" : "rgba(140,170,190,0.4)");
      ctx.stroke();
      if (!unlocked) {
        ctx.fillStyle = "rgba(120,120,130,0.55)";
        ctx.font = "bold 28px sans-serif";
        ctx.fillText(c.name, x + cardW / 2, y + 70);
        ctx.font = "bold 16px sans-serif";
        ctx.fillStyle = "rgba(180,180,190,0.7)";
        ctx.fillText("即将开放", x + cardW / 2, y + 108);
      } else {
        var pal = c.id === "obito" ? left.palette : right.palette;
        ctx.beginPath();
        ctx.arc(x + cardW / 2, y + 58, 28, 0, Math.PI * 2);
        ctx.fillStyle = pal.body;
        ctx.fill();
        ctx.strokeStyle = pal.glow;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.font = "bold 26px sans-serif";
        ctx.fillStyle = "#f4fbff";
        ctx.fillText(c.name, x + cardW / 2, y + 112);
        ctx.font = "14px sans-serif";
        ctx.fillStyle = pal.trim;
        ctx.fillText(c.blurb, x + cardW / 2, y + 140);
        addHit(x, y, cardW, cardH, (function (cid) {
          return function () {
            applyPlayerPick(cid);
            beginMatch();
          };
        })(c.id));
      }
      ctx.restore();
    }
    flowButton(40, H - 70, 140, 42, "返回", false, function () { goMode(); });
  }

  function drawHud() {
    hudHits = [];

    if (matchState === "intro") {
      drawStage();
      drawIntroScreen();
      return;
    }
    if (matchState === "mode") {
      drawStage();
      drawModeScreen();
      return;
    }
    if (matchState === "charSelect") {
      drawStage();
      drawCharSelectScreen();
      return;
    }

    drawTimer();
    if (!hudHidden) {
      ctx.textAlign = "left";
      ctx.font = "bold 16px sans-serif";
      ctx.fillStyle = "#f4efe6";
      ctx.fillText(left.name + (gameMode === "ai" && playerSide === "L" ? " · 你" : (gameMode === "ai" ? " · AI" : "")), 16, 18);
      drawResourceBars(16, 26, 230, left, false);
      drawPortrait(278, 42, left);
      var i;
      for (i = 0; i < leftOrder.length; i++) drawSkillOrb(30 + i * 56, 108, left, leftOrder[i]);

      drawPortrait(W - 278, 42, right);
      ctx.textAlign = "right";
      ctx.font = "bold 16px sans-serif";
      ctx.fillStyle = "#f4efe6";
      ctx.fillText((gameMode === "ai" && playerSide === "R" ? "你 · " : (gameMode === "ai" ? "AI · " : "")) + right.name, W - 16, 18);
      drawResourceBars(W - 16, 26, 230, right, true);
      for (i = 0; i < rightOrder.length; i++) drawSkillOrb(W - 30 - (rightOrder.length - 1 - i) * 56, 108, right, rightOrder[i]);

      drawPauseButton(34, H - 36);
      var speeds = [1, 2, 4, 8];
      for (i = 0; i < speeds.length; i++) drawSpeedChip(66 + i * 36, H - 47, speeds[i]);
      ctx.fillStyle = "#f0b429";
      roundRect(214, H - 52, 118, 32, 6);
      ctx.fill();
      ctx.strokeStyle = "#8a5a10";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.font = "bold 16px sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "#3a2208";
      ctx.fillText("隐藏界面", 273, H - 31);
      addHit(214, H - 52, 118, 32, function () { hudHidden = true; });
    } else {
      ctx.fillStyle = "rgba(20,14,10,0.72)";
      roundRect(24, H - 52, 92, 30, 6);
      ctx.fill();
      ctx.font = "bold 14px sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "#f4efe6";
      ctx.fillText("显示界面", 70, H - 32);
      addHit(24, H - 52, 92, 30, function () { hudHidden = false; });
    }
    if (matchState === "fight" || matchState === "countdown" || matchState === "roundEnd") drawSticks();

    if (matchState === "countdown") {
      var n = Math.ceil(countLeft - 0.0001);
      if (n < 1) n = 1;
      ctx.textAlign = "center";
      ctx.font = "bold 28px sans-serif";
      ctx.fillStyle = "#f4efe6";
      ctx.fillText("第" + roundIndex + "回  " + roundWinsL + ":" + roundWinsR, W / 2, H / 2 - 70);
      ctx.font = "bold 120px sans-serif";
      ctx.fillStyle = "#f4fbff";
      ctx.strokeStyle = "rgba(20,12,10,0.65)";
      ctx.lineWidth = 8;
      ctx.strokeText(String(n), W / 2, H / 2 + 24);
      ctx.fillText(String(n), W / 2, H / 2 + 24);
    }
    if (matchState === "roundEnd") {
      var rw = matchResult === "L" ? left : (matchResult === "R" ? right : null);
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(W / 2 - 220, H / 2 - 78, 440, 130);
      ctx.textAlign = "center";
      ctx.font = "bold 42px sans-serif";
      if (!rw) {
        ctx.fillStyle = "#e8eef2";
        ctx.fillText("本回平局", W / 2, H / 2 - 12);
      } else {
        ctx.fillStyle = rw.palette.glow;
        ctx.fillText(rw.name + " 赢下本回", W / 2, H / 2 - 12);
      }
      ctx.font = "18px sans-serif";
      ctx.fillStyle = "#e8eef2";
      ctx.fillText("比分 " + roundWinsL + " : " + roundWinsR + "    下一回准备中", W / 2, H / 2 + 28);
    }
    if (matchState === "result") {
      var winner = matchResult === "L" ? left : (matchResult === "R" ? right : null);
      panelBox(W / 2 - 260, H / 2 - 140, 520, 280);
      ctx.textAlign = "center";
      ctx.font = "bold 48px sans-serif";
      if (!winner) {
        ctx.fillStyle = "#e8eef2";
        ctx.fillText("平局", W / 2, H / 2 - 60);
      } else {
        ctx.fillStyle = winner.palette.glow;
        ctx.fillText(winner.name + " 获胜", W / 2, H / 2 - 60);
      }
      ctx.font = "18px sans-serif";
      ctx.fillStyle = "#e8eef2";
      ctx.fillText("三局两胜  " + roundWinsL + " : " + roundWinsR, W / 2, H / 2 - 18);
      flowButton(W / 2 - 210, H / 2 + 20, 180, 52, "再选模式", true, function () { goMode(); });
      flowButton(W / 2 + 30, H / 2 + 20, 180, 52, "返回标题", false, function () { goIntro(); });
      flowButton(W / 2 - 90, H / 2 + 90, 180, 44, "同配置再战", false, function () { beginMatch(); });
    }
    ctx.textAlign = "left";
  }

  function render() {
    var ox = 0;
    var oy = 0;
    if (shake > 0 && !isMenuState()) {
      ox = (Math.random() - 0.5) * shake;
      oy = (Math.random() - 0.5) * shake;
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.setTransform(1, 0, 0, 1, ox, oy);
    if (matchState === "intro" || matchState === "mode" || matchState === "charSelect") {
      // Flow screens paint their own stage + UI inside drawHud.
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      drawHud();
      return;
    }
    drawStage();
    drawSpikes();
    drawRings();
    drawWheels();
    var batch = [
      { y: left.y, kind: "f", who: left },
      { y: right.y, kind: "f", who: right }
    ];
    var gi;
    for (gi = 0; gi < ghosts.length; gi++) batch.push({ y: ghosts[gi].y, kind: "g", who: ghosts[gi] });
    for (gi = 0; gi < projectiles.length; gi++) batch.push({ y: projectiles[gi].y + 70, kind: "p", who: projectiles[gi] });
    for (gi = 0; gi < swords.length; gi++) batch.push({ y: swords[gi].y, kind: "b", who: swords[gi] });
    batch.sort(function (a, b) { return a.y - b.y; });
    for (gi = 0; gi < batch.length; gi++) {
      if (batch[gi].kind === "f") drawFighter(batch[gi].who);
      else if (batch[gi].kind === "g") drawGhost(batch[gi].who);
      else if (batch[gi].kind === "b") drawEnergySword(batch[gi].who);
      else drawOneProjectile(batch[gi].who);
    }
    drawBursts();
    if (right.shield > 0 && !right.repulseOn) drawAirShield(right);
    drawPullStreams(left);
    drawPullStreams(right);
    drawSparks();
    drawFloaters();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    drawHud();
  }

  var last = 0;
  function frame(now) {
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    var step = paused ? 0 : Math.min(dt, 0.05) * simSpeed;
    if (step > 0.22) step = 0.22;
    if (matchState === "fight" && phaseSlow > 0 && step > 0) {
      if (phaseSlow >= step) {
        phaseSlow -= step;
        step *= 0.5;
      } else {
        var rest = step - phaseSlow;
        step = phaseSlow * 0.5 + rest;
        phaseSlow = 0;
      }
    }
    if (matchState === "countdown") {
      if (step <= 0) {
        render();
        requestAnimationFrame(frame);
        return;
      }
      time += step;
      countLeft -= step;
      if (countLeft <= 0) {
        matchState = "fight";
        matchTime = 60;
        syncFlowHint();
      }
    } else if (matchState === "roundEnd") {
      if (step > 0) {
        time += step;
        roundEndLeft -= step;
        if (roundEndLeft <= 0) {
          roundIndex += 1;
          beginCountdown();
        }
      }
    } else if (matchState === "fight") {
      if (step > 0) {
        updateAI(step);
        update(step);
      }
      if (matchState === "fight" && step > 0) {
        matchTime -= step;
        if (matchTime <= 0) {
          matchTime = 0;
          endByTime();
        }
      }
    } else {
      time += dt;
    }
    render();
    requestAnimationFrame(frame);
  }

  var controlMap = {
    q: ["L", "punch"],
    e: ["L", "phase"],
    r: ["L", "tele"],
    f: ["L", "breath"],
    u: ["R", "thrust"],
    i: ["R", "fire"],
    o: ["R", "swap"],
    p: ["R", "spike"],
    j: ["R", "pull"],
    c: ["L", "space"],
    k: ["R", "cleave"]
  };

  function isArrowKey(key) {
    return key === "ArrowUp" || key === "ArrowDown" || key === "ArrowLeft" || key === "ArrowRight";
  }

  window.addEventListener("keydown", function (e) {
    if (e.key === "Shift") {
      keysDown.shift = true;
      return;
    }
    if (e.code === "Space" || e.key === " ") e.preventDefault();
    if (matchState === "intro" && !e.repeat) {
      e.preventDefault();
      goMode();
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      if (matchState === "result" && !e.repeat && !keysDown.enter) beginMatch();
      if (matchState === "mode" && !e.repeat) {
        gameMode = "ai";
        goCharSelect();
      }
      keysDown.enter = true;
      return;
    }
    if (matchState === "mode" || matchState === "charSelect" || matchState === "result" || matchState === "countdown" || matchState === "roundEnd") {
      if (isArrowKey(e.key)) e.preventDefault();
      return;
    }
    if (matchState !== "fight") {
      if (isArrowKey(e.key)) e.preventDefault();
      return;
    }
    if (isArrowKey(e.key)) {
      e.preventDefault();
      keysDown[e.key] = true;
      return;
    }
    var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === "w" || k === "a" || k === "s" || k === "d") {
      e.preventDefault();
      keysDown[k] = true;
      return;
    }
    var mapped = controlMap[k];
    if (!mapped) return;
    e.preventDefault();
    if (e.repeat || keysDown[k]) {
      keysDown[k] = true;
      return;
    }
    keysDown[k] = true;
    var caster = mapped[0] === "L" ? left : right;
    if (!humanControls(caster)) return;
    if (mapped[1] === "spike") shieldPressDown(right);
    else tryCast(caster, mapped[1]);
  });

  window.addEventListener("keyup", function (e) {
    if (e.key === "Shift") {
      keysDown.shift = false;
      return;
    }
    if (isArrowKey(e.key)) {
      keysDown[e.key] = false;
      return;
    }
    if (e.key === "Enter") {
      keysDown.enter = false;
      return;
    }
    var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === "p") shieldPressUp(right);
    keysDown[k] = false;
  });

  window.addEventListener("blur", function () {
    shieldPressUp(right);
    var key;
    for (key in keysDown) keysDown[key] = false;
    releaseStick(sticks[0].pid);
    releaseStick(sticks[1].pid);
  });

  var sticks = [
    { id: "L", cx: 86, cy: H - 176, r: 58, dx: 0, dy: 0, nx: 0, ny: 0, pid: null },
    { id: "R", cx: W - 86, cy: H - 176, r: 58, dx: 0, dy: 0, nx: 0, ny: 0, pid: null }
  ];

  function drawSticks() {
    var i;
    for (i = 0; i < sticks.length; i++) {
      var s = sticks[i];
      ctx.beginPath();
      ctx.arc(s.cx, s.cy, s.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(16, 12, 10, 0.42)";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(230, 214, 180, 0.9)";
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(s.cx, s.cy, 16, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(230, 214, 180, 0.35)";
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(s.cx + s.dx, s.cy + s.dy, 22, 0, Math.PI * 2);
      ctx.fillStyle = s.pid !== null ? "rgba(240, 180, 70, 0.92)" : "rgba(244, 236, 220, 0.88)";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#3a2414";
      ctx.stroke();
    }
  }

  function stickAt(x, y) {
    var i;
    for (i = 0; i < sticks.length; i++) {
      var s = sticks[i];
      if (planarDist(x, y, s.cx, s.cy) <= s.r) return s;
    }
    return null;
  }

  function aimStick(s, x, y) {
    var dx = x - s.cx;
    var dy = y - s.cy;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var max = s.r - 22;
    if (dist > max && dist > 0) {
      dx = dx / dist * max;
      dy = dy / dist * max;
      dist = max;
    }
    s.dx = dx;
    s.dy = dy;
    if (dist < 10) {
      s.nx = 0;
      s.ny = 0;
    } else {
      s.nx = dx / dist;
      s.ny = dy / dist;
    }
  }

  function releaseStick(pid) {
    var i;
    for (i = 0; i < sticks.length; i++) {
      if (sticks[i].pid === pid) {
        sticks[i].pid = null;
        sticks[i].dx = 0;
        sticks[i].dy = 0;
        sticks[i].nx = 0;
        sticks[i].ny = 0;
      }
    }
  }

  canvas.addEventListener("pointerdown", function (e) {
    if (isMenuState()) return;
    var pt = canvasPoint(e);
    if (!pt) return;
    var s = stickAt(pt.x, pt.y);
    if (!s || s.pid !== null) return;
    e.preventDefault();
    s.pid = e.pointerId;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    aimStick(s, pt.x, pt.y);
  }, { passive: false });

  canvas.addEventListener("pointermove", function (e) {
    var i, s = null;
    for (i = 0; i < sticks.length; i++) {
      if (sticks[i].pid === e.pointerId) s = sticks[i];
    }
    if (!s) return;
    e.preventDefault();
    var pt = canvasPoint(e);
    if (!pt) return;
    aimStick(s, pt.x, pt.y);
  }, { passive: false });

  canvas.addEventListener("pointerup", function (e) { releaseStick(e.pointerId); });
  canvas.addEventListener("pointercancel", function (e) { releaseStick(e.pointerId); });

  function canvasPoint(e) {
    var rect = canvas.getBoundingClientRect();
    var fit = Math.min(rect.width / W, rect.height / H);
    if (fit <= 0) return null;
    var ox = (rect.width - W * fit) / 2;
    var oy = (rect.height - H * fit) / 2;
    return {
      x: (e.clientX - rect.left - ox) / fit,
      y: (e.clientY - rect.top - oy) / fit
    };
  }

  canvas.addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;
    var pt = canvasPoint(e);
    if (!pt) return;
    if (stickAt(pt.x, pt.y)) return;
    var hi;
    if (uiLatch > time) return;
    for (hi = hudHits.length - 1; hi >= 0; hi--) {
      var zone = hudHits[hi];
      if (pt.x >= zone.x && pt.x <= zone.x + zone.w && pt.y >= zone.y && pt.y <= zone.y + zone.h) {
        uiLatch = time + 0.25;
        zone.fn();
        return;
      }
    }
    if (paused || matchState !== "fight" || koId || right.armor <= 0) return;
    if (gameMode === "ai" && playerSide !== "R") return;
    var mx = pt.x;
    var my = pt.y;
    var x0 = right.x;
    var y0 = right.y - 78;
    var dx = mx - x0;
    var dy = my - y0;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var speed = 1500;
    swords.push({
      x: x0,
      y: y0,
      vx: dx / len * speed,
      vy: dy / len * speed,
      life: 1.15,
      hit: false
    });
  });

  // Canvas UI handles intro / mode / charSelect / rematch hits via hudHits (mousedown + pointerdown).

  canvas.addEventListener("pointerdown", function (e) {
    if (matchState !== "intro" && matchState !== "mode" && matchState !== "charSelect" && matchState !== "result") return;
    var pt = canvasPoint(e);
    if (!pt) return;
    var hi;
    if (uiLatch > time) return;
    for (hi = hudHits.length - 1; hi >= 0; hi--) {
      var zone = hudHits[hi];
      if (pt.x >= zone.x && pt.x <= zone.x + zone.w && pt.y >= zone.y && pt.y <= zone.y + zone.h) {
        uiLatch = time + 0.25;
        e.preventDefault();
        zone.fn();
        return;
      }
    }
  }, { passive: false });

  reset();
  syncFlowHint();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
